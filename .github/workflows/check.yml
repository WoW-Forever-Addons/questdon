name: Check

# Syntax check of all Lua files on every push and pull request.
on: [push, pull_request]

jobs:
  luac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - shell: bash
        run: |
          status=0
          while IFS= read -r f; do luac5.1 -p "$f" || status=1; done < <(find . -name '*.lua' -not -path './.git/*')
          exit $status
